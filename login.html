<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jackulinmart Sports Shopping Marketplace - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        }

        .login-container {
            width: 850px;
            display: flex;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Left Side */

        .welcome-section {
            width: 45%;
            padding: 50px 35px;
            background: linear-gradient(160deg, #1565c0, #0d47a1);
            color: white;
            text-align: center;
        }

        .welcome-section h1 {
            font-size: 30px;
            margin-top: 30px;
            line-height: 1.3;
        }

        .welcome-section p {
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.6;
        }

        .sports-icons {
            font-size: 45px;
            margin: 30px 0;
        }

        .tagline {
            font-size: 18px;
            font-weight: bold;
        }

        /* Right Side */

        .login-section {
            width: 55%;
            padding: 50px 45px;
        }

        .login-section h2 {
            text-align: center;
            color: #222;
            margin-bottom: 30px;
            font-size: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #1565c0;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: linear-gradient(90deg, #1565c0, #42a5f5);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.9;
        }

        .register-text {
            text-align: center;
            margin-top: 22px;
            color: #555;
        }

        .register-text a {
            color: #1565c0;
            font-weight: bold;
            text-decoration: none;
        }

        .forgot-password {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .forgot-password a {
            color: #1565c0;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Welcome Section -->

        <div class="welcome-section">

            <div class="sports-icons">
                🏏 ⚽ 🏀 🏸
            </div>

            <h1>
                Jackulin Sports<br>
                Shopping Marketplace
            </h1>

            <p>
                Your one-stop destination for
                sports products and accessories.
            </p>

            <div class="tagline">
                Play More • Shop Better • Stay Active
            </div>

        </div>


        <!-- Login Section -->

        <div class="login-section">

            <h2>Welcome Back!</h2>

            <form action="home.html">

                <label>Email</label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >

                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>

                <button class="login-button" type="submit">
                    Login
                </button>

            </form>

            <div class="register-text">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </div>

        </div>

    </div>

</body>
</html>
